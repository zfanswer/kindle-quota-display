services:
  eink-dashboard:
    build: .
    restart: unless-stopped
    ports:
      - "${QUOTA_BIND_ADDRESS:-127.0.0.1}:8486:8486"
    environment:
      QUOTA_SERVER_ID: ${QUOTA_SERVER_ID:-kqd-pw3}
      QUOTA_TIMEZONE: ${QUOTA_TIMEZONE:-Asia/Shanghai}
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - type: bind
        source: ./runtime
        target: /data/quota
        read_only: true
        bind:
          create_host_path: false
    read_only: true
    tmpfs:
      - /tmp:size=8m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; assert urllib.request.urlopen('http://127.0.0.1:8486/healthz', timeout=3).status == 200"]
      interval: 30s
      timeout: 5s
      retries: 3
